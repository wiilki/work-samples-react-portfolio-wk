name: Refresh project screenshots

on:
  # Regenerate browser captures when this release updates project URLs.
  push:
    branches:
      - portfolio/kinetic-tech-command-center-2026
    paths:
      - .github/workflows/capture-previews.yml
      - scripts/preview-sources.json
  # After merge, launch from Actions whenever published project UIs change.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser capture tool
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          # Browser and system libraries are included in the pinned container.
      - name: Capture published projects
        run: node scripts/capture-previews.mjs
      - name: Commit screenshots when changed
        shell: bash
        run: |
          # Checkout sets safe.directory in a temporary HOME. Set it again in
          # the container so ordinary git write commands can locate the repo.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -A public/previews
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "Capture current screenshots of published portfolio projects"
            git -C "$GITHUB_WORKSPACE" push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No screenshot changes"
          fi
